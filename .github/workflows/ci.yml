name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install rclone (pinned, checksum verified)
        run: |
          v=v1.74.3
          f=rclone-$v-linux-amd64.zip
          curl -fsSLO "https://downloads.rclone.org/$v/$f"
          echo "dbee7ccd7a5d617e4ed4cd4555c16669b511abfe8d31164f61be35ac9e999bd2  rclone-v1.74.3-linux-amd64.zip" | sha256sum -c -
          unzip -q "$f"
          sudo install -m 0755 "rclone-$v-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  e2e:
    # install.sh into a throwaway HOME, then back up, restore and compare through the installed CLI.
    # System python3 on purpose: that is what the installed launcher uses, and where apt puts PyGObject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install PyGObject, GTK 4, libadwaita
        run: sudo apt-get update -q && sudo apt-get install -yq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Install rclone (pinned, checksum verified)
        run: |
          v=v1.74.3
          f=rclone-$v-linux-amd64.zip
          curl -fsSLO "https://downloads.rclone.org/$v/$f"
          echo "dbee7ccd7a5d617e4ed4cd4555c16669b511abfe8d31164f61be35ac9e999bd2  rclone-v1.74.3-linux-amd64.zip" | sha256sum -c -
          unzip -q "$f"
          sudo install -m 0755 "rclone-$v-linux-amd64/rclone" /usr/local/bin/rclone
      - run: scripts/e2e-restore.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # The gitleaks binary, pinned and hash-checked. (gitleaks-action fails on a
      # repo's first push: it scans from the root commit's nonexistent parent.)
      - name: Scan full history for secrets
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.23.3/gitleaks_8.23.3_linux_x64.tar.gz
          echo "73a35edc2285afd689e712b8e0ebad3f2eaf94b0d67cd6e1f0ec693ac751bb4a  gitleaks_8.23.3_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.23.3_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

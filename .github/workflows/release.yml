name: release

# release-please keeps a "chore(main): release X.Y.Z" pull request up to date from the Conventional Commits on main.
# Merging it tags vX.Y.Z and creates the GitHub Release; the second job then attaches the source tarball,
# SHA256SUMS and a build provenance attestation. Both run here because a release made with GITHUB_TOKEN
# does not trigger other workflows.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  assets:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Build the source tarball
        run: |
          name="lifeboat-${TAG#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="$name/" -o "dist/$name.tar.gz" "$TAG"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

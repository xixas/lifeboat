[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeboat"
version = "0.3.2"
description = "Back up a Linux laptop to Google Drive (or any rclone remote) and see whether it is safe to lose"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Vikas Kyatannawar" }]

[project.scripts]
lifeboat = "lifeboat.cli:main"

[project.urls]
Homepage = "https://github.com/xixas/lifeboat"

[tool.setuptools.packages.find]
include = ["lifeboat*"]

[tool.setuptools.package-data]
lifeboat = ["signin_page.html"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

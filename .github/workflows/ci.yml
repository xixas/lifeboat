name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install rclone (pinned, checksum verified)
        run: |
          v=v1.74.3
          f=rclone-$v-linux-amd64.zip
          curl -fsSLO "https://downloads.rclone.org/$v/$f"
          echo "dbee7ccd7a5d617e4ed4cd4555c16669b511abfe8d31164f61be35ac9e999bd2  rclone-v1.74.3-linux-amd64.zip" | sha256sum -c -
          unzip -q "$f"
          sudo install -m 0755 "rclone-$v-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
